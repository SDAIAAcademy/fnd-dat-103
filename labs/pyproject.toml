[project]
name = "fnd-dat-103-labs"
version = "2027.1.0"
description = "Lab notebooks for the SDAIA Academy course FND-DAT-103 Data Formats, Interfaces and Quality Checks"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandera>=0.22",
    "jsonschema>=4.23",
    "tzdata>=2025.1",
    "jupyterlab>=4.4",
]

[tool.uv]
package = false
