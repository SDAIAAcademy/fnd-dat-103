<section>
<h2>Day 1: Files: formats, text and time</h2>
<ol>
<li><p>A library sends loan records with branch codes like "007" to analysts who read files with default settings. Which hand-over keeps "007" as "007"?</p><ul><li><b>A.</b> A CSV with every field in quotes</li><li><b>B.</b> A Parquet file with the code declared as a string</li><li><b>C.</b> A JSON Lines file read back with the default reader settings</li><li><b>D.</b> A semicolon-separated file in UTF-8</li></ul></li>
<li><p>A public library's catalogue export opens in UTF-8 without any error, but its Arabic titles read as long runs of pairs like ط§ظ„. What happened?</p><ul><li><b>A.</b> It is in cp1256 and was read as UTF-8</li><li><b>B.</b> It starts with a UTF-8 byte order mark</li><li><b>C.</b> It was decoded as cp1256 once and saved again as UTF-8</li><li><b>D.</b> It was saved as UTF-16</li></ul></li>
<li><p>A fleet of parking meters writes one record each time a car leaves, all day, to a file that a nightly job reads. Which format suits that file best?</p><ul><li><b>A.</b> One JSON document holding an array of all the day's records</li><li><b>B.</b> A Parquet file rewritten after every record</li><li><b>C.</b> JSON Lines, with its schema written down</li><li><b>D.</b> A spreadsheet workbook saved after every record</li></ul></li>
<li><p>An analyst sums one column of a 40-column table of 50 million rows. Why does the Parquet copy answer faster than the CSV copy?</p><ul><li><b>A.</b> Parquet keeps the rows sorted, so the sum stops early</li><li><b>B.</b> Parquet reads only that column's chunks, already typed</li><li><b>C.</b> Parquet files hold fewer rows than the CSV</li><li><b>D.</b> Parquet keeps the whole table in memory between queries</li></ul></li>
<li><p>One read of a CSV took 0.4 seconds and one read of the same data as Parquet took 0.6 seconds on a colleague's laptop. That is enough evidence to state that CSV reads faster than Parquet for this data.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A hospital pharmacy writes dispensing records as Parquet. Most queries ask for one month, sometimes one ward. Which partition column fits?</p><ul><li><b>A.</b> The prescription number</li><li><b>B.</b> The patient's record code</li><li><b>C.</b> The dispensing month</li><li><b>D.</b> The exact time of dispensing, to the second</li></ul></li>
<li><p>A training centre's attendance export opens in pandas, the first column is visibly named trainee_code, yet df["trainee_code"] raises a KeyError. What is the likely cause?</p><ul><li><b>A.</b> A byte order mark before the first column name</li><li><b>B.</b> The file uses semicolons where the reader expects commas</li><li><b>C.</b> The trainee codes have leading zeros</li><li><b>D.</b> The file was saved with Windows line endings</li></ul></li>
<li><p>Decoding a file as Windows-1256 can succeed without any error even when the file is really UTF-8.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>The first bytes of a supplier's price list read ff fe 70 00 72 00 69 00. What is it?</p><ul><li><b>A.</b> A UTF-8 file with a byte order mark</li><li><b>B.</b> A Windows-1256 file</li><li><b>C.</b> A file that was double-encoded</li><li><b>D.</b> UTF-16 text, little-endian</li></ul></li>
<li><p>A border-crossing camera logs times without offsets. Compared with a UTC reference, it is 300 minutes behind in winter and 240 minutes behind in summer. What is the right repair?</p><ul><li><b>A.</b> Add 270 minutes, the average gap, to every time</li><li><b>B.</b> Localise to the camera’s zone, then convert to UTC</li><li><b>C.</b> Add 300 minutes, the winter gap, to every time</li><li><b>D.</b> Drop the summer months as unreliable, keep the winter</li></ul></li>
<li><p>In a zone that leaves daylight saving in autumn, a bare local time inside the repeated hour can be placed in UTC from the time alone.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Interfaces and the boundary</h2>
<ol>
<li><p>A water utility's meter readings, logged without offsets, run exactly 240 minutes ahead of the billing system's UTC times on every day of the year. What is the fault?</p><ul><li><b>A.</b> A clock in a zone that has daylight saving time</li><li><b>B.</b> A file saved in a legacy code page</li><li><b>C.</b> A CSV that lost the column's type</li><li><b>D.</b> A clock on a fixed offset, read as UTC</li></ul></li>
<li><p>A pull from a weather-station network's API gets these four answers on different pages. Which one should it retry after a wait, with no change to the request?</p><ul><li><b>A.</b> 503 Service Unavailable</li><li><b>B.</b> 400 Bad Request: "limit must be at most 200"</li><li><b>C.</b> 401 Unauthorized</li><li><b>D.</b> 404 Not Found for one station</li></ul></li>
<li><p>A library's loans batch has 400 rows. Twelve rows (3%) name a branch code that is not in the branch register; every other check passes. The written rules: reject on a changed interface, or above 5% quarantined.</p><ul><li><b>A.</b> Reject the whole batch</li><li><b>B.</b> Map the twelve codes to the nearest valid branch and load all</li><li><b>C.</b> Load 388 rows and quarantine 12 with their reason</li><li><b>D.</b> Load 388 rows and drop the 12</li></ul></li>
<li><p>A client of a weather-station API gets 401 Unauthorized on its first request. What should it do?</p><ul><li><b>A.</b> Retry with exponential backoff, up to six times</li><li><b>B.</b> Wait one minute and try again</li><li><b>C.</b> Stop and report: the credentials are wrong</li><li><b>D.</b> Switch to the offset endpoint</li></ul></li>
<li><p>A city transit API answers 429 Too Many Requests with the header Retry-After: 30. What does a well-behaved client do next?</p><ul><li><b>A.</b> Waits 30 seconds, then sends the same request again</li><li><b>B.</b> Sends the request again at once, using a second token</li><li><b>C.</b> Gives up on the pull and reports the API as down</li><li><b>D.</b> Waits one second and doubles the page size</li></ul></li>
<li><p>A client pages a news-alerts API by offset, newest first, 100 per page. During the pull, 15 new alerts are published. What happens?</p><ul><li><b>A.</b> Nothing changes: offsets are fixed when the pull starts</li><li><b>B.</b> 15 alerts arrive twice and the 15 new ones are missed</li><li><b>C.</b> The client sees the 15 new alerts on its next page</li><li><b>D.</b> The API returns an error and the pull restarts</li></ul></li>
<li><p>If a pull stops after writing a page's records but before saving its checkpoint, a rerun that skips ids already kept loads every record exactly once.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A colleague's notebook pulling from a ticketing API has the token typed into a cell. What is the safest change?</p><ul><li><b>A.</b> Put the token in a comment so it does not run</li><li><b>B.</b> Split the token into two strings joined at run time</li><li><b>C.</b> Clear the notebook's outputs before sharing it</li><li><b>D.</b> Read it from the environment or an ignored .env</li></ul></li>
<li><p>Each order from a bakery's API holds a customer object and a list of items. How should it be flattened for analysis?</p><ul><li><b>A.</b> One wide table with columns item_1, item_2, item_3 and so on</li><li><b>B.</b> An orders table and an items table that carries the order id</li><li><b>C.</b> One table per customer</li><li><b>D.</b> Keep each order's item list as a JSON string in a single column</li></ul></li>
<li><p>After writing a partitioned Parquet dataset, how do you prove the files have the declared schema?</p><ul><li><b>A.</b> Print the first rows and look at them</li><li><b>B.</b> Count the rows in each partition</li><li><b>C.</b> Check that each folder name starts with the partition column name</li><li><b>D.</b> Read a written file’s schema and compare it with the declared</li></ul></li>
<li><p>In a hive-partitioned dataset, the partition column is stored inside every Parquet file as well as in the folder names.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>Every record of today's batch from a lab-results supplier has result_value renamed to value. What should the load do?</p><ul><li><b>A.</b> Reject the batch and report the changed field to the supplier</li><li><b>B.</b> Quarantine all records one by one</li><li><b>C.</b> Rename the field silently and load the batch</li><li><b>D.</b> Load the batch with result_value left empty</li></ul></li>
<li><p>A load quarantines 6 rows of a 400-row batch from a school's attendance system. Who should act on them, and how?</p><ul><li><b>A.</b> The loader's author fixes the rows and loads them the same day</li><li><b>B.</b> Nobody: quarantined rows are deleted after a week</li><li><b>C.</b> The school's data owner corrects them at the source and resends; someone else reviews the release</li><li><b>D.</b> The analyst who reads the tables fills in the gaps by hand</li></ul></li>
<li><p>To show that a set of validation checks works, it must catch every seeded defect and also let a clean batch pass.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>Which rule needs the whole batch, not one record at a time?</p><ul><li><b>A.</b> Every reading has a number for its value</li><li><b>B.</b> Every time carries a UTC offset</li><li><b>C.</b> The status is one of three allowed words</li><li><b>D.</b> No order id appears twice in the batch</li></ul></li>
</ol>

null,"tolerance":null,"unit":null,"explanation":"JSON Lines appends one complete record per line, so a writer adds a line and a reader streams them; the written schema covers what the text format cannot carry.","misconceptions":["Treats a JSON array as appendable: the closing bracket means every append rewrites the file","Treats columnar as always best: Parquet files are written whole, not appended one record at a time","","Treats a workbook as a log: rewriting a whole workbook per record is slow and fragile"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo1-columns-read","type":"single","prompt":"An analyst sums one column of a 40-column table of 50 million rows. Why does the Parquet copy answer faster than the CSV copy?","options":[{"key":"A","text":"Parquet keeps the rows sorted, so the sum stops early"},{"key":"B","text":"Parquet reads only that column's chunks, already typed"},{"key":"C","text":"Parquet files hold fewer rows than the CSV"},{"key":"D","text":"Parquet keeps the whole table in memory between queries"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Columns are stored together with their types, so the reader fetches one column's chunks and skips parsing text; a CSV must be read and parsed line by line.","misconceptions":["Confuses statistics with sorting: a sum needs every value whatever the order","","Assumes compression drops rows: the same data has the same rows in both files","Confuses a file format with a cache: a file on disk keeps nothing in memory"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo1-timing-claim","type":"tf","prompt":"One read of a CSV took 0.4 seconds and one read of the same data as Parquet took 0.6 seconds on a colleague's laptop. That is enough evidence to state that CSV reads faster than Parquet for this data.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"One timing on one machine moves with the cache and the run; compare medians of several reads on one machine, and trust sizes and type fidelity more than seconds.","misconceptions":["Treats a single timing as a property of the format",""],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo1-partition-column","type":"single","prompt":"A hospital pharmacy writes dispensing records as Parquet. Most queries ask for one month, sometimes one ward. Which partition column fits?","options":[{"key":"A","text":"The prescription number"},{"key":"B","text":"The patient's record code"},{"key":"C","text":"The dispensing month"},{"key":"D","text":"The exact time of dispensing, to the second"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A partition column should match the common filter and have tens to hundreds of values; one folder per month lets a query open only its month.","misconceptions":["Picks a unique key: one folder per prescription writes millions of tiny files","Picks an identifier people rarely filter on, and one with too many values","","Picks the finest grain possible: almost every row gets its own folder"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo2-keyerror","type":"single","prompt":"A training centre's attendance export opens in pandas, the first column is visibly named trainee_code, yet df[\"trainee_code\"] raises a KeyError. What is the likely cause?","options":[{"key":"A","text":"A byte order mark before the first column name"},{"key":"B","text":"The file uses semicolons where the reader expects commas"},{"key":"C","text":"The trainee codes have leading zeros"},{"key":"D","text":"The file was saved with Windows line endings"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Read as plain UTF-8, the mark becomes an invisible character at the start of the first column name; utf-8-sig removes it.","misconceptions":["","Expects a wrong delimiter to rename one column: it would put every column into one","Confuses a value problem with a name problem: zeros change values, not column names","Expects line endings to change the header: pandas handles CRLF line endings"],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo2-cp1256-silent","type":"tf","prompt":"Decoding a file as Windows-1256 can succeed without any error even when the file is really UTF-8.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Windows-1256 maps every byte to a character, so it never fails; it returns the wrong letters, which is why a known word must confirm the encoding.","misconceptions":["","Assumes a wrong encoding always raises an error"],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo2-zero-bytes","type":"single","prompt":"The first bytes of a supplier's price list read ff fe 70 00 72 00 69 00. What is it?","options":[{"key":"A","text":"A UTF-8 file with a byte order mark"},{"key":"B","text":"A Windows-1256 file"},{"key":"C","text":"A file that was double-encoded"},{"key":"D","text":"UTF-16 text, little-endian"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"ff fe is the UTF-16 little-endian mark, and a zero byte after each ASCII letter is how UTF-16 stores them.","misconceptions":["Mixes up the marks: the UTF-8 mark is ef bb bf","Expects a single-byte code page to contain zero bytes: its letters are one byte each","Confuses two faults: double encoding is valid UTF-8 with wrong letters, not zero bytes",""],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo2-offset-changes","type":"single","prompt":"A border-crossing camera logs times without offsets. Compared with a UTC reference, it is 300 minutes behind in winter and 240 minutes behind in summer. What is the right repair?","options":[{"key":"A","text":"Add 270 minutes, the average gap, to every time"},{"key":"B","text":"Localise to the camera’s zone, then convert to UTC"},{"key":"C","text":"Add 300 minutes, the winter gap, to every time"},{"key":"D","text":"Drop the summer months as unreliable, keep the winter"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A gap that changes with the date is a zone with daylight saving; only that zone's rules give each time its own offset.","misconceptions":["Averages two offsets: every time ends up wrong by 30 minutes","","Treats a changing gap as fixed: summer times stay an hour off","Throws data away instead of reading it right"],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo2-repeated-hour","type":"tf","prompt":"In a zone that leaves daylight saving in autumn, a bare local time inside the repeated hour can be placed in UTC from the time alone.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The repeated hour happens twice with two offsets; another clue, such as the order of events, is needed to choose the pass.","misconceptions":["Assumes every local time names one instant",""],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo3-retry-401","type":"single","prompt":"A client of a weather-station API gets 401 Unauthorized on its first request. What should it do?","options":[{"key":"A","text":"Retry with exponential backoff, up to six times"},{"key":"B","text":"Wait one minute and try again"},{"key":"C","text":"Stop and report: the credentials are wrong"},{"key":"D","text":"Switch to the offset endpoint"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A 401 says the request itself is not allowed; repeating it adds load and can lock the token, so the client stops and reports.","misconceptions":["Retries every error: backoff is for temporary failures such as 503","Treats an authorisation failure as a rate limit","","Thinks a different endpoint bypasses authentication"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo3-retry-after","type":"single","prompt":"A city transit API answers 429 Too Many Requests with the header Retry-After: 30. What does a well-behaved client do next?","options":[{"key":"A","text":"Waits 30 seconds, then sends the same request again"},{"key":"B","text":"Sends the request again at once, using a second token"},{"key":"C","text":"Gives up on the pull and reports the API as down"},{"key":"D","text":"Waits one second and doubles the page size"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The server has said how long to wait; honouring Retry-After is both polite and the fastest way back to a 200.","misconceptions":["","Evades the limit instead of respecting it, which breaks most APIs' terms","Treats a rate limit as an outage: the API is up and has said when to return","Ignores the header and asks for more per request, which may be limited too"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo3-offset-inserts","type":"single","prompt":"A client pages a news-alerts API by offset, newest first, 100 per page. During the pull, 15 new alerts are published. What happens?","options":[{"key":"A","text":"Nothing changes: offsets are fixed when the pull starts"},{"key":"B","text":"15 alerts arrive twice and the 15 new ones are missed"},{"key":"C","text":"The client sees the 15 new alerts on its next page"},{"key":"D","text":"The API returns an error and the pull restarts"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"New items at the top shift every later item down, so the next offset repeats 15 already seen; a cursor names the last item seen and does not shift.","misconceptions":["Assumes an offset is a snapshot: it is a position in a list that keeps changing","","Expects new items to appear further down: newest first puts them before the current offset","Expects the API to detect the change: offset paging fails silently"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo3-idempotent","type":"tf","prompt":"If a pull stops after writing a page's records but before saving its checkpoint, a rerun that skips ids already kept loads every record exactly once.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The rerun fetches that page again, and keying the write by id makes the second write change nothing: an idempotent load.","misconceptions":["","Assumes a page fetched twice must produce duplicates whatever the write does"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo3-token","type":"single","prompt":"A colleague's notebook pulling from a ticketing API has the token typed into a cell. What is the safest change?","options":[{"key":"A","text":"Put the token in a comment so it does not run"},{"key":"B","text":"Split the token into two strings joined at run time"},{"key":"C","text":"Clear the notebook's outputs before sharing it"},{"key":"D","text":"Read it from the environment or an ignored .env"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A token in code travels with every copy, history and output of the notebook; reading it from the environment keeps it out of all of them.","misconceptions":["Thinks a comment hides it: the text is still in the file and its history","Thinks obfuscation is protection: anyone can join the two strings","Clears only outputs: the token stays in the cell's source",""],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-grain","type":"single","prompt":"Each order from a bakery's API holds a customer object and a list of items. How should it be flattened for analysis?","options":[{"key":"A","text":"One wide table with columns item_1, item_2, item_3 and so on"},{"key":"B","text":"An orders table and an items table that carries the order id"},{"key":"C","text":"One table per customer"},{"key":"D","text":"Keep each order's item list as a JSON string in a single column"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Things that occur once per order become columns of the orders table; the list becomes its own table at the item grain, joined back by the order id.","misconceptions":["Fixes the number of items in advance: a longer order breaks the table","","Confuses grouping with flattening: tables are made per grain, not per value","Leaves the nesting in place: the items cannot be typed, filtered or summed"],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-schema-proof","type":"single","prompt":"After writing a partitioned Parquet dataset, how do you prove the files have the declared schema?","options":[{"key":"A","text":"Print the first rows and look at them"},{"key":"B","text":"Count the rows in each partition"},{"key":"C","text":"Check that each folder name starts with the partition column name"},{"key":"D","text":"Read a written file’s schema and compare it with the declared"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The file's own schema is what readers will get: compare names, types, time zone and nullability with the declaration, leaving out the partition column that lives in the path.","misconceptions":["Trusts printed values: a float and a decimal, or two time zones, can print alike","Checks completeness, not types","Checks the layout, not the content of the files",""],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-partition-in-path","type":"tf","prompt":"In a hive-partitioned dataset, the partition column is stored inside every Parquet file as well as in the folder names.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The value lives in the folder name (day=2026-10-21); readers add it back as a column when they read the dataset.","misconceptions":["Assumes every column of the table is in every file",""],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo5-renamed-field","type":"single","prompt":"Every record of today's batch from a lab-results supplier has result_value renamed to value. What should the load do?","options":[{"key":"A","text":"Reject the batch and report the changed field to the supplier"},{"key":"B","text":"Quarantine all records one by one"},{"key":"C","text":"Rename the field silently and load the batch"},{"key":"D","text":"Load the batch with result_value left empty"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"When every record breaks the same way, the interface changed: rejecting once names the cause, and the supplier fixes it at the source.","misconceptions":["","Hides one cause behind hundreds of row reports","Repairs a contract break without the owner knowing, so the next change goes unnoticed","Loads data that is known to be incomplete"],"lo":["LO5"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo5-quarantine-owner","type":"single","prompt":"A load quarantines 6 rows of a 400-row batch from a school's attendance system. Who should act on them, and how?","options":[{"key":"A","text":"The loader's author fixes the rows and loads them the same day"},{"key":"B","text":"Nobody: quarantined rows are deleted after a week"},{"key":"C","text":"The school's data owner corrects them at the source and resends; someone else reviews the release"},{"key":"D","text":"The analyst who reads the tables fills in the gaps by hand"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Quarantine exists so owners see what failed; the owner corrects the source, and keeping release apart from the loader's author keeps the check honest.","misconceptions":["Lets the person who wrote the checks also override them: no separation of duties","Treats quarantine as deletion: the owner never learns what failed","","Patches the output instead of the source, so the fault returns next batch"],"lo":["LO5"],"day":2,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo5-clean-pass","type":"tf","prompt":"To show that a set of validation checks works, it must catch every seeded defect and also let a clean batch pass.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Catching defects alone is not enough: checks that reject everything would also catch them; the clean batch passing shows they reject only what is wrong.","misconceptions":["","Counts catching defects as enough, without a clean batch that must pass"],"lo":["LO5"],"day":2,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo5-table-rule","type":"single","prompt":"Which rule needs the whole batch, not one record at a time?","options":[{"key":"A","text":"Every reading has a number for its value"},{"key":"B","text":"Every time carries a UTC offset"},{"key":"C","text":"The status is one of three allowed words"},{"key":"D","text":"No order id appears twice in the batch"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Uniqueness compares rows with each other, so it runs on the table; types, patterns and allowed values can be checked on each record alone, for example with a JSON Schema.","misconceptions":["A type check looks at one value in one record","A pattern check looks at one value in one record","An allowed-values check looks at one value in one record",""],"lo":["LO5"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"}]}</script>
